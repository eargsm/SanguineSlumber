; Sanguine Slumber - settings
; Also editable in game: Mod Control Panel (SKSE Menu Framework) > Sanguine Slumber.
; The in-game menu rewrites this file whenever you change a setting.

[General]
; Master switch. false = the mod does nothing (vanilla drain infection, no sleep rolls).
bEnabled = true

; true = a vampire's Vampiric Drain can no longer give you Sanguinare Vampiris.
bBlockDrainInfection = true

; Percent chance (0 - 100) to contract Sanguinare Vampiris each time you sleep. Default 0.5
fSleepChanceSafe = 0.50

; true = sleeping in the wild uses its own chance below. Safe = inns, homes, temples, castles and
; town/city grounds (LocTypeDwelling / LocTypeHabitation / LocTypePlayerHouse, or an interior cell with
; no location). Wild = everywhere else: camps, caves, ruins, forts, wilderness. Defaults: true, 2.0
bSeparateWildChance = true
fSleepChanceWild = 2.00

; true = only roll after a full, uninterrupted sleep.
bRequireUninterruptedSleep = false

; Show a message when you catch it from sleeping.
bShowNotification = true
sNotificationText = You have contracted Sanguinare Vampiris.

; How long (seconds) after a vampire's drain hits you its infection attempt is blocked.
; The vanilla drain script fires ~0.07s after the hit; 5 leaves room for script lag.
fDrainWindowSeconds = 5.0

; Extra detail in Documents/My Games/Skyrim Special Edition/SKSE/SanguineSlumber.log
bVerboseLog = true

[Addons]
; Sanguine Slumber - OStim Visitor (separate download). Ignored when the add-on is not installed.
bOStimVisitorEnabled = true
